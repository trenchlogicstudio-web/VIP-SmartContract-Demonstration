  POST /v3/precommit:
  - INVALID_VIP
  - INVALID_BUDGET
  - INVALID_MODE
  - INVALID_ELIGIBILITY
  - INVALID_ELIGIBILITY_AT
  - SESSION_LIVE
  - COMMITMENT_ACTIVE
  - TERMS_CHANGED
  - BAD_JSON
